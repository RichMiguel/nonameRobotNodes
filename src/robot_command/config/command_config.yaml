# ==============================================================================
# Robot Command Configuration File (robot_command)
# Mendukung kontrol navigasi, deteksi rintangan/tabrakan, replanning, dan feedback suara.
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 5000                   # Port TCP kompatibel dengan comand-inst (NLU) & Dashboard
  max_connections: 10
  timeout_sec: 3.0
  broadcast_feedback: true     # Kirim feedback real-time ke semua client yang tersambung

safety:
  enable_obstacle_detection: true
  warning_distance: 0.55       # Jarak deteksi rintangan awal (meter)
  critical_distance: 0.30      # Jarak kritis / potensi tabrakan (meter)
  front_angle_min_deg: -50.0   # Sudut kiri sektor depan (derajat)
  front_angle_max_deg: 50.0    # Sudut kanan sektor depan (derajat)
  throttle_feedback_sec: 2.5   # Jeda minimum pengiriman peringatan rintangan yang sama

navigation:
  action_server: "navigate_to_pose"
  goal_pose_topic: "/goal_pose"
  scan_topic: "/scan"
  plan_topic: "/plan"
  odom_topic: "/odom"
  replan_detection: true
  replan_min_points_diff: 5     # Selisih perubahan titik path untuk mendeteksi lintasan baru
  goal_timeout_sec: 180.0       # Timeout maksimal navigasi (detik)

# Template kalimat feedback suara (TTS) dan tampilan Dashboard
feedback_templates:
  GOAL_ACCEPTED: "Perintah navigasi ke {location} diterima. Robot mulai bergerak."
  NAVIGATING: "Robot sedang bergerak menuju {location}. Sisa jarak {distance:.1f} meter."
  GOAL_REACHED: "Robot sudah sampai di {location}."
  OBSTACLE_WARNING: "Peringatan! Terdeteksi rintangan di depan robot pada jarak {distance:.2f} meter."
  OBSTACLE_CLEARED: "Rintangan di depan telah bersih. Robot melanjutkan perjalanan."
  REPLANNING_PATH: "Jalur terhalang. Sedang menghitung lintasan baru menuju {location}."
  GOAL_CANCELLED: "Perintah navigasi dibatalkan. Robot berhenti."
  GOAL_ABORTED: "Gagal mencapai {location}. Rute tidak dapat dilalui atau terhalang total."
  EMERGENCY_STOP: "Pemberhentian darurat diaktifkan. Semua motor dimatikan."
  UNKNOWN_COMMAND: "Perintah tidak dikenali oleh sistem."
  LOCATION_NOT_FOUND: "Lokasi {location} tidak ditemukan dalam daftar waypoint."

