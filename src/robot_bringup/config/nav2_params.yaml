amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    transform_tolerance: 1.0
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    max_particles: 2000
    min_particles: 500
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 2.45
      y: 1.8
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 50
    default_server_timeout: 500
    # default_nav_to_pose_bt_xml: replace/with/path/to/navigate_to_pose_w_replanning_and_recovery.xml

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5 # Waktu toleransi controller sebelum abort (default sebelumnya 0.3 terlalu sempit)
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # Goal Checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15 # Toleransi sampai di titik x,y (meter)
      yaw_goal_tolerance: 0.15 # Toleransi sudut (radian)
      stateful: True

    # Progress Checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    # RPP Controller untuk Differential Drive / X-Drive mode tank
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2
      lookahead_dist: 0.30 # Jarak pandang forward carrot
      min_lookahead_dist: 0.20 # Jarak minimum saat robot melambat
      max_lookahead_dist: 0.60 # Batas maksimum proyeksi carrot agar tidak mendeteksi dinding yang masih jauh
      lookahead_time: 1.0
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true # Carrot menyusut saat robot mendekati rintangan/tujuan
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.45 # Mencegah alarm tabrakan palsu saat rintangan masih jauh (sebelumnya 1.0s)
      use_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.40
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      # Bentuk fisik sasis robot 50x50cm
      footprint: "[ [0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25] ]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.29 # Mencegah ray mendeteksi bodi robot sendiri
          obstacle_max_range: 3.0
          raytrace_min_range: 0.29
          raytrace_max_range: 3.5
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0 # Penurunan cost lebih cepat menjauh dari dinding
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # Bentuk fisik sasis robot 50x50cm
      footprint: "[ [0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25] ]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.29
          obstacle_max_range: 3.0
          raytrace_min_range: 0.29
          raytrace_max_range: 3.5
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.4

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "" # Akan diisi dari parameter launch

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.8] # [vx, vy, wz] max
    min_velocity: [-0.35, 0.0, -0.8]
    max_accel: [0.5, 0.0, 0.8] # Limit akselerasi
    max_decel: [-0.5, 0.0, -0.8] # Limit deselerasi
    odom_topic: "odom"
    odom_duration: 0.1
