amcl:
  ros__parameters:
    use_sim_time: False
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # Parameter Noise Odometri untuk Holonomik X-Drive
    alpha1: 0.3
    alpha2: 0.3
    alpha3: 0.3
    alpha4: 0.3
    alpha5: 0.3
    # Parameter Pemulihan Otomatis AMCL (Kidnapped Robot Recovery)
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.10
    # Threshold update standar agar estimasi posisi stabil dan tidak bergetar (bebas micro-jumps)
    update_min_d: 0.25
    update_min_a: 0.20
    transform_tolerance: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    max_particles: 1500
    min_particles: 500
    scan_topic: scan
    set_initial_pose: false

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    use_sim_time: False
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 50
    default_server_timeout: 100

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.10
      stateful: True

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    # RPP Controller: Didesain khusus tikungan tajam lorong sempit tanpa zig-zag di jalan lurus
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      
      # 1. Lookahead Adaptif (Mencegah Zig-zag di jalan lurus & Mencegah Tabrak Dinding di tikungan)
      lookahead_dist: 0.60
      min_lookahead_dist: 0.30       # Batas bawah saat melambat di tikungan (tidak memotong sudut)
      max_lookahead_dist: 0.80       # Batas atas di jalan lurus (stabil & mulus)
      lookahead_time: 1.5            # Skala lookahead sebanding kecepatan (v * lookahead_time)
      use_velocity_scaled_lookahead_dist: true

      # 2. Deselerasi Otomatis pada Tikungan Tajam (Curvature-based scaling)
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.85    # Jika belokan radius < 0.85m, robot otomatis melambat
      min_approach_linear_velocity: 0.08           # Kecepatan aman saat bermanuver di tikungan
      approach_velocity_scaling_dist: 0.60

      # 3. Deselerasi Otomatis di Dekat Rintangan (Cost-based scaling)
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.40
      cost_scaling_gain: 1.0

      # 4. Rotasi di Tempat HANYA pada Sudut Tajam Siku > 70 derajat (~1.22 rad)
      # Tidak aktif di belokan ringan (< 70 deg) sehingga tetap mengalir mulus tanpa menyentak
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 1.22
      rotate_to_heading_angular_vel: 0.60
      max_angular_accel: 1.5

      # 5. Deteksi Tabrakan
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.45
      transform_tolerance: 0.5
      inflation_cost_scaling_factor: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 1.5
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: '[ [0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25] ]'
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 3.0
          raytrace_min_range: 0.15
          raytrace_max_range: 3.5
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: '[ [0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25] ]'
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 3.0
          raytrace_min_range: 0.15
          raytrace_max_range: 3.5
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Memaksa rute global mengambil jalur tengah lorong dan menjauhi sudut siku dinding
        cost_scaling_factor: 4.5
        inflation_radius: 0.35

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 15.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.3, 0.8]
    min_velocity: [-0.35, -0.3, -0.8]
    max_accel: [0.8, 0.1, 1.5]
    max_decel: [-0.8, -0.1, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
