# Konfigurasi Nav2 + als_ros2 (MCL) berbasis nav2_params_paper.yaml
# Menggantikan blok 'amcl' dengan node 'mcl' dari als_ros2

mcl:
  ros__parameters:
    use_sim_time: False
    node_name: "mcl"
    map_name: "/map"
    scan_name: "/scan"
    odom_name: "/odom"
    gl_sampled_poses_name: "/gl_sampled_poses"
    local_map_name: "/gl_local_map"
    sdf_keypoints_name: "/gl_sdf_keypoints"
    local_sdf_keypoints_name: "/gl_local_sdf_keypoints"
    map_frame: "map"
    odom_frame: "odom"
    base_link_frame: "base_link"
    laser_frame: "laser"
    residual_errors_name: "/residual_errors"
    pose_name: "/mcl_pose"
    particles_name: "/mcl_particles"
    unknown_scan_name: "/unknown_scan"
    reliability_marker_name: "/reliability_marker_name"
    broadcast_tf: true
    use_odom_tf: true
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_yaw: 0.0
    initial_noise_x: 0.05
    initial_noise_y: 0.05
    initial_noise_yaw: 0.05
    # 2: Class-conditional measurement model (tahan objek dinamis)
    measurement_model_type: 2
    # Disesuaikan untuk CPU Raspberry Pi 4B (bisa dinaikkan ke 1000 jika CPU longgar)
    particle_num: 600
    use_augmented_mcl: false
    alpha_slow: 0.001
    alpha_fast: 0.99
    add_random_particles_in_resampling: true
    # Tidak menggunakan pergerakan menyamping (Differential Drive Motion Model)
    use_omni_directional_model: false
    reject_unknown_scan: false
    publish_unknown_scan: true
    unknown_scan_prob_threshold: 0.9
    publish_residual_errors: true
    scan_step: 5
    z_hit: 0.9
    z_short: 0.2
    z_max: 0.05
    z_rand: 0.05
    var_hit: 0.08
    lambda_short: 1.0
    lambda_unknown: 0.01
    known_class_prior: 0.5
    resample_threshold_ess: 0.5
    estimate_reliability: true
    classifier_type: 0
    mae_max_residual_error: 0.5
    mae_histrogram_bin_width: 0.05
    fuse_gl_pose_sampler_only_unreliable: false
    gl_sampled_pose_time_th: 1.0
    gmm_positional_variance: 0.01
    gmm_angular_variance: 0.01
    pred_dist_unif_rate: 0.05
    write_pose: false
    pose_log_file: "/tmp/als_ros2_pose.txt"
    localization_hz: 10.0
    transform_tolerance: 0.5
    random_particles_noise:
      - 0.05
      - 0.05
      - 0.1
    odom_noise_ddm:
      - 0.5
      - 0.2
      - 0.2
      - 0.5
    odom_noise_odm:
      - 4.0
      - 1.0
      - 1.0
      - 1.0
      - 4.0
      - 1.0
      - 1.0
      - 1.0
      - 8.0
    rel_trans_ddm:
      - 0.0
      - 0.0
    rel_trans_odm:
      - 0.0
      - 0.0
      - 0.0
    resample_thresholds:
      - 0.2
      - 0.2
      - 0.2
      - 0.02
      - -99999.0

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    use_sim_time: False
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 50
    default_server_timeout: 100

controller_server:
  ros__parameters:
    use_sim_time: False
    # Disesuaikan ke 10 Hz agar hemat CPU Raspberry Pi 4B
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
      stateful: True

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 25.0

    # RPP Controller dengan parameter eksperimen Table 1 dari Paper arXiv:2601.15006
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # vmax = 0.5 m/s
      desired_linear_vel: 0.30

      # Lookahead teredam untuk stabilitas anti-zigzag
      lookahead_dist: 0.5
      min_lookahead_dist: 0.50
      max_lookahead_dist: 0.80
      # lt = 1.4 (skala adaptif lookahead = v * lt)
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true

      # Rmin = 0.9 m (Curvature heuristic: deselerasi jika radius < 0.9m)
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      # vregmin = 0.25 m/s (Batas minimum deselerasi saat belokan tajam)
      regulated_linear_scaling_min_speed: 0.25
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60

      # Proximity / Cost heuristic
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.40
      cost_scaling_gain: 1.0

      # Batasan akselerasi sudut (dihaluskan untuk mencegah scan distortion dan zigzag)
      max_angular_accel: 0.6
      rotate_to_heading_angular_vel: 0.6
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.8

      # Safety & Collision Check
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.45
      transform_tolerance: 0.5
      inflation_cost_scaling_factor: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 4.0
      publish_frequency: 1.5
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: '[ [0.23, 0.23], [0.23, -0.23], [-0.23, -0.23], [-0.23, 0.23] ]'
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 3.0
          raytrace_min_range: 0.15
          raytrace_max_range: 3.5
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.6

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      use_sim_time: False
      footprint: '[ [0.23, 0.23], [0.23, -0.23], [-0.23, -0.23], [-0.23, 0.23] ]'
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 3.0
          raytrace_min_range: 0.15
          raytrace_max_range: 3.5
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.8

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 10.0
    scale_velocities: True
    feedback: "OPEN_LOOP"
    # Batasan kecepatan dari Table 1 (vmax = 0.5 m/s, w_max = 1.0 rad/s)
    max_velocity: [0.30, 0.01, 1.0]
    min_velocity: [-0.30, -0.01, -1.0]
    # Batasan akselerasi & deselerasi dari Table 1 (a_max = 0.5 m/s^2, alpha_max = 1.0 rad/s^2)
    max_accel: [0.30, 0.01, 1.0]
    max_decel: [-0.30, -0.01, -1.0]
    odom_topic: "odom"
    odom_duration: 0.1
